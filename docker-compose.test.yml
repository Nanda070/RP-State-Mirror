name: mirror-test

services:
  postgres-test:
    image: postgres:16-alpine
    # Tests empty every table before each test, which leaves tens of thousands of files behind.
    # With durability on, a checkpoint syncs them all and freezes the database for half a minute,
    # and a test that waits for a transaction fails. The data lives in memory anyway.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: mirror_test
      POSTGRES_USER: mirror_test
      POSTGRES_PASSWORD: mirror_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror_test -d mirror_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  storage-test:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -s3.port=9000 -bucket=mirror-test -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: mirror_test
      AWS_SECRET_ACCESS_KEY: mirror_test_password
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data
