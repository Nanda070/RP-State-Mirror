name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirror_test
          POSTGRES_PASSWORD: mirror_test_password
          POSTGRES_DB: mirror_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mirror_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirror_test:mirror_test_password@localhost:55432/mirror_test
      TEST_DATABASE_URL: postgresql://mirror_test:mirror_test_password@localhost:55432/mirror_test
      # Dummy dashboard OAuth env so `next build` can import auth without secrets.
      DISCORD_CLIENT_ID: "1000000000000000001"
      DISCORD_CLIENT_SECRET: "ci-discord-client-secret"
      SESSION_SECRET: "ci-session-secret-16+"
      OAUTH_REDIRECT_URL: http://localhost:3000/api/auth/callback/discord
      SUPER_ADMIN_USER_IDS: "1000000000000000001"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
