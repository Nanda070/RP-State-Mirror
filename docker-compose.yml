services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mirror-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data -s3.port=9000 -bucket=mirror -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: mirror_local
      AWS_SECRET_ACCESS_KEY: mirror_local_password
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - mirror-storage:/data

  # Daily backup: database dump (kept BACKUP_KEEP_DAYS days) and a copy of the file storage,
  # both on a separate volume. See docs/DEPLOYMENT.md for restore.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      TZ: Europe/Moscow
      PGHOST: postgres
      PGDATABASE: mirror
      PGUSER: mirror
      PGPASSWORD: mirror_local_password
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: mirror
      S3_ACCESS_KEY: mirror_local
      S3_SECRET_KEY: mirror_local_password
      BACKUP_AT: "04:00"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - mirror-backups:/backups

volumes:
  mirror-postgres:
  mirror-storage:
  mirror-backups:
