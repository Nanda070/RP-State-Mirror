services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Durability (fsync) stays on: this is the real data. The settings below keep one stuck client
    # from holding the others up and put slow work into the log:
    #  - a transaction left open and idle for a minute is ended, so its locks cannot block the rest;
    #  - queries over a second, lock waits and checkpoints are logged (docker compose logs postgres).
    command: >
      postgres
      -c idle_in_transaction_session_timeout=60000
      -c log_min_duration_statement=1000
      -c log_lock_waits=on
      -c log_checkpoints=on
    # Room for parallel queries; Docker's default of 64 MB is too little.
    shm_size: 256mb
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      # Values come from .env next to this file; the defaults are for local development only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirror_local_password}
    # A second installation on the same server (the test copy) takes other ports: POSTGRES_PORT, S3_PORT in its .env.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mirror-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data -s3.port=9000 -bucket=mirror -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mirror_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mirror_local_password}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
    volumes:
      - mirror-storage:/data

  # Daily backup: database dump (kept BACKUP_KEEP_DAYS days) and a copy of the file storage,
  # both on a separate volume. See docs/DEPLOYMENT.md for restore.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      TZ: Europe/Moscow
      PGHOST: postgres
      PGDATABASE: mirror
      PGUSER: mirror
      PGPASSWORD: ${POSTGRES_PASSWORD:-mirror_local_password}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: mirror
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mirror_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mirror_local_password}
      BACKUP_AT: "${BACKUP_AT:-04:00}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes:
      - mirror-backups:/backups

volumes:
  mirror-postgres:
  mirror-storage:
  mirror-backups:
