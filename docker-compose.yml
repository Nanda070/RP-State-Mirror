services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mirror-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data -s3.port=9000 -bucket=mirror -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: mirror_local
      AWS_SECRET_ACCESS_KEY: mirror_local_password
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - mirror-storage:/data

volumes:
  mirror-postgres:
  mirror-storage:
